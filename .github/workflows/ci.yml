name: LocalOps AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Validate Configurations & Manifests
        run: |
          python -c "import yaml; yaml.safe_load(open('configs/api.yaml'))"
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
          python -c "import yaml; yaml.safe_load(open('configs/prometheus_alerts.yml'))"

      - name: Run Deterministic Non-GPU Test Suite
        run: |
          pytest -m "not gpu and not slow" -v --tb=short

      - name: Validate Release Artifacts Integrity
        run: |
          python scripts/verify_release.py
