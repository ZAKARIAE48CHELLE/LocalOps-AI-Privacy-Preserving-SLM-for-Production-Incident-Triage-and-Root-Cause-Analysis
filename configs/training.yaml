# LocalOps AI - Phase 5 Training Configuration (QLoRA Fine-Tuning)

model:
  base_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_file: "data/generated/train.jsonl"
  validation_file: "data/generated/validation.jsonl"
  test_file: "data/generated/test.jsonl" # Strictly isolated; training pipeline rejects loading this!
  max_length: 1024
  system_prompt: "You are a production incident triage assistant.\nReturn only valid JSON following the required schema."

training:
  output_dir: "artifacts/phase_5"
  checkpoints_dir: "artifacts/phase_5/checkpoints"
  final_adapter_dir: "artifacts/phase_5/final_adapter"
  seed: 42
  num_train_epochs: 3.0
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2 # Effective batch size = 16 (Optimal sweet spot without VRAM paging)
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 40
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  assistant_only_loss: true
  bf16: true
  fp16: false
  dataloader_num_workers: 0

validation:
  generation_eval_steps: 200
  generation_sample_size: 48 # Stratified sample across 6 incident types (8 each)

smoke:
  num_train_samples: 32
  num_val_samples: 8
  max_steps: 5
  output_dir: "artifacts/phase_5/smoke"
