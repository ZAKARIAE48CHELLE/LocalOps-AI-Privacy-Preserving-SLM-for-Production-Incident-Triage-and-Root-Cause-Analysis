[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localops-ai"
version = "1.0.0"
description = "Privacy-Preserving SLM for Production Incident Triage and Root Cause Analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LocalOps AI Engineering Team" }
]
dependencies = [
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: Isolated fast unit tests without external resources",
    "integration: Multi-component API and pipeline integration tests",
    "gpu: Hardware-accelerated local tests requiring an active NVIDIA GPU",
    "slow: Tests with long execution times",
    "docker: Container packaging and compose configuration tests",
    "benchmark: Performance, latency, and telemetry validation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
